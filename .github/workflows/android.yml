name: Android

on:
  push:
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Use candidate debug keystore
        run: |
          mkdir -p "$HOME/.android"
          cp app/signing/candidate-ci.keystore "$HOME/.android/debug.keystore"
      - name: Verify Android
        run: ./gradlew testCandidateDebugUnitTest lintCandidateDebug assembleStableDebug assembleCandidateDebug
      - name: Candidate SHA-256
        run: sha256sum app/build/outputs/apk/candidate/debug/app-candidate-debug.apk > app-candidate-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: hassan-ai-candidate
          path: |
            app/build/outputs/apk/candidate/debug/app-candidate-debug.apk
            app-candidate-debug.apk.sha256
