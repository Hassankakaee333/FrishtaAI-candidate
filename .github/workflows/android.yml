name: Android

on:
  push:
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Use candidate debug keystore
        run: |
          mkdir -p "$HOME/.android"
          cp app/signing/candidate-ci.keystore "$HOME/.android/debug.keystore"
      - name: Ensure Gradle wrapper executable
        run: chmod +x gradlew
      - name: Verify Android
        run: ./gradlew testCandidateDebugUnitTest lintCandidateDebug assembleStableDebug assembleCandidateDebug
      - name: Candidate SHA-256
        run: sha256sum app/build/outputs/apk/candidate/debug/app-candidate-debug.apk > app-candidate-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: hassan-ai-candidate
          path: |
            app/build/outputs/apk/candidate/debug/app-candidate-debug.apk
            app-candidate-debug.apk.sha256
      - name: Prepare phone-only update manifest
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        run: |
          APK="app/build/outputs/apk/candidate/debug/app-candidate-debug.apk"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          VERSION_CODE="$(awk '/versionCode =/{print $3; exit}' app/build.gradle.kts)"
          VERSION_NAME="$(awk -F'"' '/versionName =/{print $2; exit}' app/build.gradle.kts)"
          cat > candidate-update.json <<EOF
          {"versionCode":${VERSION_CODE},"versionName":"${VERSION_NAME}-candidate","apkUrl":"https://github.com/Hassankakaee333/FrishtaAI-candidate/releases/download/candidate-latest/app-candidate-debug.apk","sha256":"${SHA}","releaseNotes":"Phone-only cloud build with Hassan Phone Agent"}
          EOF
      - name: Publish candidate-latest for direct phone update
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git tag -f candidate-latest "$GITHUB_SHA"
          git push --force origin refs/tags/candidate-latest
          if gh release view candidate-latest >/dev/null 2>&1; then
            gh release edit candidate-latest --title "Latest Candidate" --prerelease --notes "Automatically built and verified from main."
          else
            gh release create candidate-latest --title "Latest Candidate" --prerelease --notes "Automatically built and verified from main."
          fi
          gh release upload candidate-latest \
            app/build/outputs/apk/candidate/debug/app-candidate-debug.apk \
            app-candidate-debug.apk.sha256 \
            candidate-update.json \
            --clobber
